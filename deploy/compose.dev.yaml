# Development with hot reload: only the database, Seq and Caddy run in Docker.
#   docker compose -f deploy/compose.dev.yaml up -d
#   dotnet watch --project backend/src/XiDach.Api      (http://localhost:5080)
#   npm --prefix frontend run dev                       (http://localhost:3000)
#   open http://localhost:8080 — Caddy routes /api and /hubs to the API and the rest to Next.js, as in production.
name: xidach-dev

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: xidach
      POSTGRES_USER: xidach
      POSTGRES_PASSWORD: xidach_dev # local development only, never used outside this machine
    volumes:
      - pgdata-dev:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xidach -d xidach"]
      interval: 5s
      timeout: 3s
      retries: 20

  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    volumes:
      - seqdata-dev:/data
    ports:
      - "127.0.0.1:5341:80"

  caddy:
    image: caddy:2
    environment:
      API_UPSTREAM: host.docker.internal:5080
      WEB_UPSTREAM: host.docker.internal:3000
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata-dev:
  seqdata-dev:
